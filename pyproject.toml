[project]
name = "explainer-studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "s0g09hc", email = "swati.garg@walmart.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
